{% extends "game_base.html" %}
{% from "_macros.html" import game_canvas %}
{% block stats %}
<div class="stat stat-main"><span class="stat-label">Score</span><span id="score" class="stat-value">0</span></div>
<div class="stat"><span class="stat-label">Lines</span><span id="lines" class="stat-value">0</span></div>
<div class="stat"><span class="stat-label">Level</span><span id="level" class="stat-value">1</span></div>
{% endblock %}
{% block board %}{{ game_canvas(300, 600) }}{% endblock %}
{% block side_extra %}
<section class="panel next-panel" aria-labelledby="next-title">
  <h2 class="panel-title" id="next-title">Next</h2>
  <canvas id="next" width="120" height="120"></canvas>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='tetris_engine.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='tetris.js') }}"></script>
{% endblock %}
