{% extends "base.html" %}
{% block title %}Partie · Schach · ABW Arcade{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/chess.css') }}">
{% endblock %}
{% block content %}
<div class="chess-page chess-shell" data-game-id="{{ game_id }}">
  <div class="game-head">
    <a class="back-link" href="{{ url_for('chess_lobby_page') }}"><svg class="icon icon-back" aria-hidden="true"><use href="#i-chevron"/></svg>Lobby</a>
    <h1 class="page-title">Schach</h1>
  </div>

  <div class="game-cols">
    <div class="board-frame">
      <div id="chessBoard" class="board-grid" aria-label="Schachbrett"></div>
      <div id="promoOverlay" class="promo-overlay" style="display:none">
        <div class="promo-box" role="dialog" aria-label="Umwandlung wählen">
          <p class="promo-title">Umwandeln in …</p>
          <button type="button" data-promo="Q"><img src="{{ url_for('static', filename='chess/pieces/wQ.svg') }}" alt="">Dame</button>
          <button type="button" data-promo="R"><img src="{{ url_for('static', filename='chess/pieces/wR.svg') }}" alt="">Turm</button>
          <button type="button" data-promo="B"><img src="{{ url_for('static', filename='chess/pieces/wB.svg') }}" alt="">Läufer</button>
          <button type="button" data-promo="N"><img src="{{ url_for('static', filename='chess/pieces/wN.svg') }}" alt="">Springer</button>
        </div>
      </div>
    </div>

    <aside class="side-panel">
      <section class="panel players">
        <div id="rowTop" class="player-row"><span class="pname">…</span><span class="prating"></span></div>
        <div id="rowBottom" class="player-row"><span class="pname">…</span><span class="prating"></span></div>
        <p id="unratedTag" class="unrated-tag" style="display:none">Übungspartie gegen den Bot, ohne Elo-Wertung</p>
      </section>

      <p id="statusLine" class="status-line" aria-live="polite"></p>
      <div id="drawBanner" class="draw-banner" style="display:none"></div>

      <section class="panel" aria-labelledby="moves-title">
        <h2 class="panel-title" id="moves-title">Züge</h2>
        <div id="movelist" class="movelist"><span class="lobby-empty">Noch keine Züge.</span></div>
      </section>

      <div class="action-row" id="actionRow">
        <button id="drawBtn" class="btn btn-secondary btn-sm" type="button">Remis anbieten</button>
        <button id="resignBtn" class="btn btn-danger btn-sm" type="button">Aufgeben</button>
      </div>
    </aside>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='chess_game.js') }}"></script>
{% endblock %}
