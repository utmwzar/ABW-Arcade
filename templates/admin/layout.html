{% extends "base.html" %}
{% block title %}Admin · ABW Arcade{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}
{% block flashes %}{% endblock %}
{% block content %}
<div class="page-head admin-head">
  <h1 class="page-title">Admin</h1>
  <nav class="subnav" aria-label="Adminbereich">
    <a href="{{ url_for('admin_dashboard') }}" {% if active == 'dash' %}aria-current="page"{% endif %}>Übersicht</a>
    <a href="{{ url_for('admin_users') }}" {% if active == 'users' %}aria-current="page"{% endif %}>Spieler</a>
    <a href="{{ url_for('admin_scores') }}" {% if active == 'scores' %}aria-current="page"{% endif %}>Scores</a>
  </nav>
</div>
{% include "_flash.html" %}
<div class="admin">
  {% block admin %}{% endblock %}
</div>
{% endblock %}
